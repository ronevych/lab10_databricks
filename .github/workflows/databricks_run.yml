name: Databricks Automation CI

on:
  push:
    branches: 
      - main
      - test

jobs:
  run-databricks-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install databricks-sdk python-dotenv

      - name: Run Databricks Automation Script
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          WORKSPACE_BASE_PATH: ${{ secrets.WORKSPACE_BASE_PATH }}
          DATABRICKS_EXISTING_CLUSTER_ID: ${{ secrets.DATABRICKS_EXISTING_CLUSTER_ID }}
        run: python automate_platform_ops.py